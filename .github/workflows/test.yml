name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev,excel]"

      - name: Lint
        run: ruff check src tests

      - name: Test
        run: pytest -q --cov=compliance_check --cov-report=term-missing

      - name: Doctor runs with no credentials and no network
        run: compliance-check doctor

      - name: The shipped rule files load
        run: compliance-check frameworks

      - name: The shipped sample data behaves as documented
        run: |
          # Six of eight records need attention, so a non-zero exit is expected here.
          compliance-check run -i data/sample_records.csv -f US --as-of 2025-06-01 \
            -o /tmp/ci-out --audit-log /tmp/ci-audit.jsonl --no-details || true
          python -c "
          import json
          summary = json.load(open('/tmp/ci-out/report.json'))['summary']
          assert summary == {
              'total': 8, 'compliant': 2, 'non_compliant': 4,
              'indeterminate': 2, 'no_rules': 0, 'needs_attention': 6,
          }, summary
          print('sample data:', summary)
          "

      - name: Replaying the audit log against unchanged rules must be silent
        # This is the regression gate. An earlier implementation reported every check made
        # during a coverage gap as a change, so an untouched rule set produced 112 false
        # alarms out of 480. If that ever comes back, this step fails.
        run: |
          compliance-check run -i data/sample_records.csv -f EU --as-of 2024-06-01 \
            -o /tmp/ci-out2 --audit-log /tmp/ci-audit.jsonl --no-details || true
          output=$(compliance-check replay --audit-log /tmp/ci-audit.jsonl)
          echo "$output"
          echo "$output" | grep -q "diverged" && exit 1
          echo "$output" | grep -q "no_longer_covered" && exit 1
          echo "$output" | grep -q "rules_changed" && exit 1
          echo "replay reproduced every entry, including the coverage-gap checks"

  test-windows:
    # The Linux job runs the full suite plus this project's own checks. This job runs the
    # test suite on Windows, where the default encoding is cp1252 and paths use backslashes:
    # several projects in this portfolio shipped bugs that only failed there.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install -e ".[dev,excel]"

      - name: Test
        run: pytest -q
