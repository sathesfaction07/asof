[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "asof"
version = "0.1.0"
description = "Evaluates structured records against versioned, dated regulatory rule sets with a reproducible audit log"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.6",
]

[project.scripts]
asof = "compliance_check.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/compliance_check"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
